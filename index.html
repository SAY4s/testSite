function compressImage(file, maxW = 560, quality = 0.72){
  return new Promise((resolve, reject)=>{
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('فایل تصویر معتبر نیست'));
      img.onload = ()=>{
        const sc = Math.min(1, maxW / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let out = c.toDataURL('image/jpeg', quality);
        if (out.length > 120000) out = c.toDataURL('image/jpeg', 0.5);
        resolve(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function svcTr(s){
  if (!isSvc() || !s) return s;
  SVC_DICT.forEach(([a,b])=>{ if (s.includes(a)) s = s.split(a).join(b); });
  return s.replace(SVC_PRICE0, '$1قیمت توافقی');
}
/* محتوای نوشته‌ی مدیر (نام خدمت، توضیحات، درباره ما ...) دست نمی‌خورد */
const SVC_SKIP = 'script,style,textarea,input,select,option,.p-name,.pd-name,.pd-desc,.cart-item-name,.o-items td,.ptable td,.hero,.prose,.feature,.step,.faq,.contact-item,.ct-group,.svc-switch,.order-summary-mini .row:not(.total) span:first-child,.edit-item span';
function svcFix(n){
  const p = n.parentElement; if (!p || p.closest(SVC_SKIP)) return;
  const v = svcTr(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v;
}
function svcFixAttr(e){
  const o = e.getAttribute('placeholder'), v = svcTr(o);
  if (v !== o) e.setAttribute('placeholder', v);
}
function svcWalk(root){
  if (!isSvc()) return;
  if (root.nodeType === 3){ svcFix(root); return; }
  if (root.nodeType !== 1) return;
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = []; let n;
  while ((n = tw.nextNode())) list.push(n);
  list.forEach(svcFix);
  if (root.matches('[placeholder]')) svcFixAttr(root);
  root.querySelectorAll('[placeholder]').forEach(svcFixAttr);
}
new MutationObserver(muts=>{
  if (!isSvc()) return;
  for (const m of muts){
    if (m.type === 'characterData') svcFix(m.target);
    else m.addedNodes.forEach(svcWalk);
  }
}).observe(document.body, { childList:true, subtree:true, characterData:true });

productArt = function(p){ return isSvc() ? SVC_ART.replace('{T}', esc((p && p.name) || '')) : _svcProductArt(p); };

function withWhen(notes){
  const w = document.getElementById('coWhen');
  const v = (isSvc() && w) ? w.value.trim() : '';
  return v ? ('زمان مورد نظر: ' + v + (notes ? '\n' + notes : '')) : notes;
}
function ensureWhenField(){
  const notes = document.getElementById('coNotes'); if (!notes) return;
  const ex = document.getElementById('whenField');
  if (!isSvc()){ if (ex) ex.remove(); return; }
  if (ex) return;
  const d = document.createElement('div'); d.className = 'f-field'; d.id = 'whenField';
  d.innerHTML = '<label>زمان یا تاریخ مورد نظر برای انجام خدمت</label><input type="text" id="coWhen" placeholder="مثلاً پنجشنبه صبح یا ۲۵ آبان">';
  notes.closest('.f-field').before(d);
}
function applySiteType(){
  const svc = isSvc();
  document.body.classList.toggle('mode-service', svc);
  Object.keys(SHIP_METHODS).forEach(k => delete SHIP_METHODS[k]);
  Object.assign(SHIP_METHODS, svc ? SERVICE_METHODS : SHOP_METHODS);
  const fs = document.getElementById('fShip');
  if (fs) fs.innerHTML = `<option value="all">${svc ? 'همه نحوه‌های ارائه' : 'همه روش‌های ارسال'}</option>`
    + Object.entries(SHIP_METHODS).map(([k,v]) => `<option value="${k}">${esc(v.label)}</option>`).join('');
  ensureWhenField();
  if (svc) svcWalk(document.body);
}

/* ---------- لودینگ اولیه ---------- */
function bootError(msg){
  const m = document.getElementById('bootMsg'); if (!m) return;
  m.innerHTML = esc(msg) + '<br><button class="btn" style="margin-top:12px" onclick="location.reload()">تلاش دوباره</button>';
  const sp = document.querySelector('.boot-spin'); if (sp) sp.style.display = 'none';
}
function hideBootLoader(){
  const l = document.getElementById('bootLoader'); if (!l) return;
  l.classList.add('done'); setTimeout(()=>l.remove(), 450);
}

/* ---------- راه‌اندازی ---------- */
async function init(){
  setAdmin(isAdmin());
  updateAccountLink();
  updateCartBadge();
  try{
    CONFIG = await loadConfig();
    const prP = ghGetFile(PRODUCTS_FILE);
    const ctP = ghGetFile(CATEGORIES_FILE).catch(()=>null);
    const cnP = ghGetFile(CONTENT_FILE, true).catch(()=>null);
    const pr = await prP;
    PRODUCTS = pr.data;
    const ct = await ctP; if (ct && ct.data.length) CATEGORIES = ct.data;
    const cn = await cnP; if (cn && Object.keys(cn.data).length){ CONTENT = mergeContent(cn.data); }
    applyContent();
  } catch(err){
    bootError(err.message);
    return;
  }
  route();
  hideBootLoader();
}
init();
</script>
