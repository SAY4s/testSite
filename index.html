<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>در حال بارگذاری…</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Lalezar&display=swap');

:root{
  --cream:#f6f1e4;
  --sheet:#fffdf8;
  --ink:#2a2318;
  --soil:#4a3826;
  --muted:#7a7059;
  --leaf:#3f6b35;
  --leaf-dark:#2b4a24;
  --leaf-light:#e8f0e3;
  --wheat:#d9a441;
  --wheat-dark:#b9842a;
  --line:#e3d7b8;
  --err:#a4342a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:'Vazirmatn','Tahoma',sans-serif;
  line-height:1.75;
}
h1,h2,h3,.brand-mark{font-family:'Lalezar','Vazirmatn',sans-serif;font-weight:400;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select,textarea{font-family:inherit;}

/* ===== Header ===== */
.site-header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,var(--leaf) 0%,var(--leaf-dark) 100%);
  color:#fdfaf0;
  padding:0 18px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.header-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:12px 0;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{font-size:26px;letter-spacing:.5px;}
.brand small{display:block;font-size:11px;font-weight:400;color:#dce9d4;}
nav.main-nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
nav.main-nav a{
  padding:9px 14px;border-radius:5px;font-size:14.5px;font-weight:600;
  display:flex;align-items:center;gap:6px;
  transition:background .15s;
}
nav.main-nav a:hover, nav.main-nav a.active{background:rgba(255,255,255,.14);}
.badge{
  background:var(--wheat);color:var(--soil);font-weight:800;
  font-size:11.5px;min-width:19px;height:19px;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;padding:0 5px;
}

/* ===== Layout ===== */
main{max-width:1180px;margin:0 auto;padding:0 18px 70px;}
.view{display:none;}
.view.active{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ===== Hero ===== */
.hero{
  margin:22px 0 28px;
  padding:40px 32px;
  border-radius:10px;
  background:
    repeating-linear-gradient(120deg, rgba(63,107,53,.06) 0 26px, rgba(63,107,53,0) 26px 52px),
    linear-gradient(135deg,var(--leaf-light), #fdfaf0 70%);
  border:1px solid var(--line);
  text-align:center;
}
.hero h1{font-size:34px;color:var(--leaf-dark);margin:0 0 10px;}
.hero p{color:var(--muted);font-size:15px;margin:0;max-width:560px;margin:0 auto;}

/* ===== Filters ===== */
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.filters .cat-btn{
  padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--sheet);font-size:13.5px;font-weight:600;color:var(--soil);
  transition:all .15s;
}
.filters .cat-btn:hover{border-color:var(--leaf);}
.filters .cat-btn.active{background:var(--leaf);border-color:var(--leaf);color:#fff;}
.search-box{margin-inline-start:auto;flex:1 1 220px;max-width:280px;}
.search-box input{
  width:100%;padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;
  background:var(--sheet);font-size:14px;
}
.search-box input:focus{outline:none;border-color:var(--leaf);}

/* ===== Product grid/cards ===== */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;}
.p-card{
  background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s;
}
.p-card:hover{box-shadow:0 10px 24px rgba(42,35,24,.1);transform:translateY(-3px);}
.p-thumb{
  aspect-ratio:1.3/1;display:flex;align-items:center;justify-content:center;
  padding:22px;color:var(--leaf);background:var(--leaf-light);
}
.p-thumb svg{width:58%;height:58%;}
.p-thumb img{width:100%;height:100%;object-fit:cover;}
.p-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:5px;flex:1;}
.p-cat{font-size:11.5px;color:var(--wheat-dark);font-weight:700;}
.p-name{font-size:15px;font-weight:700;color:var(--ink);}
.p-price{margin-top:auto;font-size:14.5px;font-weight:800;color:var(--leaf-dark);}
.p-unit{font-size:11.5px;color:var(--muted);font-weight:400;}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}

/* ===== Product detail ===== */
.product-detail{display:grid;grid-template-columns:1fr 1.15fr;gap:34px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:30px;margin-top:10px;}
.pd-image{background:var(--leaf-light);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:36px;color:var(--leaf);min-height:260px;}
.pd-image svg{width:50%;height:50%;}
.pd-image img{width:100%;height:100%;object-fit:cover;border-radius:10px;}
.pd-cat{color:var(--wheat-dark);font-weight:700;font-size:12.5px;}
.pd-name{font-size:25px;font-weight:800;margin:6px 0 10px;color:var(--ink);}
.pd-price{font-size:22px;font-weight:800;color:var(--leaf-dark);margin-bottom:4px;}
.pd-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0 18px;}
.pd-desc{font-size:14.5px;color:#4a4231;line-height:1.9;margin-bottom:22px;}
.qty-row{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;}
.stepper button{width:38px;height:38px;background:var(--leaf-light);font-size:18px;color:var(--leaf-dark);font-weight:700;}
.stepper input{width:48px;text-align:center;border:none;font-size:15px;background:transparent;}
.btn{
  padding:12px 28px;border-radius:8px;font-weight:700;font-size:14.5px;
  background:var(--leaf);color:#fff;transition:background .15s;
}
.btn:hover{background:var(--leaf-dark);}
.btn.gold{background:var(--wheat);color:var(--soil);}
.btn.gold:hover{background:var(--wheat-dark);}
.btn.outline{background:transparent;border:1.5px solid var(--leaf);color:var(--leaf-dark);}
.btn:disabled{background:#b8b19d;cursor:not-allowed;}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--leaf-dark);font-weight:600;font-size:13.5px;margin:18px 0 0;}

/* ===== Cart ===== */
.cart-table{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.cart-table th{background:var(--leaf-light);color:var(--leaf-dark);font-size:12.5px;padding:12px;text-align:right;}
.cart-table td{padding:12px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle;}
.cart-item-name{display:flex;align-items:center;gap:10px;font-weight:700;}
.cart-item-name .mini-thumb{width:40px;height:40px;border-radius:6px;background:var(--leaf-light);color:var(--leaf);padding:7px;flex:none;}
.cart-remove{color:var(--err);font-size:12.5px;font-weight:600;background:none;}
.cart-summary{display:flex;justify-content:flex-end;margin-top:18px;}
.cart-summary-box{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px 22px;min-width:260px;}
.cart-summary-box .row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;}
.cart-summary-box .total{font-weight:800;font-size:17px;color:var(--leaf-dark);border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;}
.cart-actions{display:flex;justify-content:flex-end;margin-top:14px;}

/* ===== Forms (checkout / account / admin) ===== */
.form-card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:28px;max-width:560px;margin:10px auto 0;}
.form-card h2{font-size:21px;color:var(--leaf-dark);margin:0 0 18px;text-align:center;}
.f-field{margin-bottom:16px;}
.f-field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px;color:var(--soil);}
.f-field label .req{color:var(--err);margin-inline-start:3px;}
.f-field input,.f-field textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:7px;
  background:#fffef9;font-size:14.5px;
}
.f-field input:focus,.f-field textarea:focus{outline:none;border-color:var(--leaf);}
.f-field textarea{min-height:70px;resize:vertical;}
.f-err{font-size:12px;color:var(--err);min-height:15px;margin-top:3px;}
.order-summary-mini{background:var(--leaf-light);border-radius:8px;padding:14px 16px;margin-bottom:20px;font-size:13.5px;}
.order-summary-mini .row{display:flex;justify-content:space-between;padding:3px 0;}
.order-summary-mini .total{font-weight:800;border-top:1px dashed var(--line);margin-top:6px;padding-top:7px;color:var(--leaf-dark);}

.tabs{display:flex;gap:8px;margin-bottom:22px;background:var(--leaf-light);border-radius:8px;padding:4px;}
.tabs button{flex:1;padding:10px;border-radius:6px;background:transparent;font-weight:700;font-size:14px;color:var(--leaf-dark);}
.tabs button.active{background:var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.08);}

.status{margin-top:14px;padding:11px 14px;border-radius:7px;font-size:13.5px;display:none;text-align:center;}
.status.ok{display:block;background:#e6efe2;border:1px solid var(--leaf);color:var(--leaf-dark);}
.status.bad{display:block;background:#f5e4e1;border:1px solid var(--err);color:var(--err);}

.order-success{text-align:center;padding:40px 20px;}
.order-success .mark{font-size:46px;margin-bottom:10px;}
.order-success h2{color:var(--leaf-dark);margin-bottom:8px;}
.order-success p{color:var(--muted);font-size:14px;}

/* ===== Admin ===== */
.admin-gate{max-width:360px;margin:40px auto;text-align:center;}
.orders-table-wrap{overflow-x:auto;}
.orders-table{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13.5px;}
.orders-table th{background:var(--soil);color:#fdf8ea;padding:10px;text-align:right;white-space:nowrap;}
.orders-table td{padding:10px;border-top:1px solid var(--line);vertical-align:top;}
.pill{padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
.pill.pending{background:#fbe8c6;color:#8a5a0f;}
.pill.done{background:#dcefd6;color:var(--leaf-dark);}
.pill-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:11.5px;cursor:pointer;}
.pill-btn:hover{border-color:var(--leaf);}
.admin-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.admin-toolbar h2{margin:0;font-size:20px;color:var(--leaf-dark);}
.mini-items{font-size:12px;color:var(--muted);max-width:220px;}

/* ===== روش ارسال (checkout) ===== */
.ship-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.ship-opt{position:relative;cursor:pointer;}
.ship-opt input{position:absolute;opacity:0;inset:0;cursor:pointer;}
.ship-body{display:block;border:1.5px solid var(--line);border-radius:9px;padding:12px;background:#fffef9;text-align:center;transition:all .15s;}
.ship-body b{display:block;font-size:14.5px;color:var(--soil);}
.ship-body small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.6;}
.ship-opt input:checked + .ship-body{border-color:var(--leaf);background:var(--leaf-light);box-shadow:0 0 0 2px rgba(63,107,53,.18);}
.ship-note{font-size:12.5px;color:var(--wheat-dark);background:#fbf2dc;border-radius:7px;padding:9px 12px;margin:10px 0 0;}
.f-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.f-field select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:7px;background:#fffef9;font-size:14.5px;}
.f-field input[readonly]{background:#f1ecdc;color:var(--muted);}
.account-box{text-align:center;}
.account-box h2{margin-bottom:6px;}
.account-box p{color:var(--muted);margin:0 0 18px;font-size:14px;}

/* ===== پنل مدیریت سفارشات ===== */
.stat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.stat-chip{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--soil);}
.stat-chip.active{background:var(--soil);border-color:var(--soil);color:#fdf8ea;}
.stat-chip span{margin-inline-start:6px;opacity:.75;}
.admin-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.admin-filters select,.admin-filters input{padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--sheet);font-size:13.5px;font-family:inherit;}
.admin-filters input{flex:1 1 240px;}
.o-card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden;}
.o-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 16px;background:var(--leaf-light);border-bottom:1px solid var(--line);}
.o-head .o-id{font-weight:800;color:var(--leaf-dark);}
.o-head .o-date{font-size:12.5px;color:var(--muted);}
.o-pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill.preparing{background:#dfe9f7;color:#244a7c;}
.pill.shipped{background:#e3dcf5;color:#4a3a85;}
.pill.canceled{background:#f5dcd8;color:var(--err);}
.pill.ship{background:#f3ead0;color:#7a5a12;}
.o-body{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;padding:16px;}
.o-sec h4{margin:0 0 5px;font-size:12px;color:var(--wheat-dark);font-weight:800;}
.o-sec p{margin:0;font-size:14px;line-height:1.9;word-break:break-word;}
.o-sec.full{grid-column:1/-1;}
.o-items{width:100%;border-collapse:collapse;font-size:13px;}
.o-items th{text-align:right;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line);}
.o-items td{padding:5px 6px;border-bottom:1px dashed var(--line);}
.o-total{display:flex;justify-content:space-between;font-weight:800;color:var(--leaf-dark);padding:8px 6px 0;font-size:15px;}
.o-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:#fbf8ef;}
.o-foot select,.o-foot input{padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;background:#fff;}
.o-foot input{flex:1 1 180px;}
.o-foot .pill-btn{padding:8px 14px;font-size:13px;}
.o-foot .save{background:var(--leaf);color:#fff;border-color:var(--leaf);}
.o-hist{font-size:11.5px;color:var(--muted);}
@media (max-width:700px){.o-body{grid-template-columns:1fr;}.f-row2{grid-template-columns:1fr;}}

/* ===== بخش‌های توضیحی ===== */
.section-title{font-size:26px;color:var(--leaf-dark);text-align:center;margin:46px 0 8px;}
.section-sub{text-align:center;color:var(--muted);font-size:14px;margin:0 auto 26px;max-width:560px;}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
.feature{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px 18px;text-align:center;}
.feature .ic{width:46px;height:46px;margin:0 auto 10px;color:var(--leaf);background:var(--leaf-light);border-radius:50%;padding:10px;}
.feature h3{font-size:18px;margin:0 0 6px;color:var(--soil);}
.feature p{margin:0;font-size:13.5px;color:var(--muted);}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;counter-reset:st;}
.step{position:relative;background:var(--leaf-light);border-radius:10px;padding:22px 18px 18px;text-align:center;}
.step::before{counter-increment:st;content:counter(st,persian);position:absolute;top:-14px;right:50%;transform:translateX(50%);
  width:30px;height:30px;border-radius:50%;background:var(--wheat);color:var(--soil);font-weight:800;display:flex;align-items:center;justify-content:center;}
.step h3{font-size:17px;margin:6px 0 4px;color:var(--leaf-dark);}
.step p{margin:0;font-size:13px;color:#4a4231;}
.about-hero{margin:22px 0 10px;}
.prose{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:26px 28px;font-size:14.5px;line-height:2;color:#3d3626;}
.prose h3{font-size:20px;color:var(--leaf-dark);margin:0 0 8px;}
.prose p{margin:0 0 12px;}
.faq details{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:10px;}
.faq summary{cursor:pointer;font-weight:700;color:var(--soil);}
.faq details p{margin:10px 0 0;font-size:13.5px;color:#4a4231;line-height:1.9;}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.contact-item{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:center;font-size:14px;}
.contact-item b{display:block;color:var(--leaf-dark);margin-bottom:4px;}
.footer-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:8px;}
.footer-links a{color:var(--leaf-dark);font-weight:600;}
@counter-style persian{system:numeric;symbols:'۰' '۱' '۲' '۳' '۴' '۵' '۶' '۷' '۸' '۹';}
footer{text-align:center;padding:26px 14px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);margin-top:40px;}

@media (max-width:760px){
  .product-detail{grid-template-columns:1fr;}
  .cart-table thead{display:none;}
  .cart-table, .cart-table tbody, .cart-table tr, .cart-table td{display:block;width:100%;}
  .cart-table tr{border-top:1px solid var(--line);padding:10px 12px;}
  .cart-table td{border:none;padding:4px 0;}
}

/* ===== تم شیشه‌ای ===== */
:root{--glass:rgba(255,255,255,.52);--glass-border:rgba(255,255,255,.72);--glass-shadow:0 8px 32px rgba(42,35,24,.10);--glass-tint:rgba(232,240,227,.55);}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:rgba(255,253,248,.94);--glass-tint:rgba(232,240,227,.95);}
}
body{
  background:
    radial-gradient(900px 520px at 12% -5%, rgba(63,107,53,.38), transparent 60%),
    radial-gradient(800px 500px at 100% 8%, rgba(217,164,65,.38), transparent 60%),
    radial-gradient(900px 600px at 50% 105%, rgba(63,107,53,.28), transparent 60%),
    #ece6d2;
  background-attachment:fixed;
  min-height:100vh;
}
.site-header{
  background:rgba(43,74,36,.60);
  -webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
  border-bottom:1px solid rgba(255,255,255,.2);
}
.hero,.p-card,.product-detail,.form-card,.feature,.prose,.faq details,.contact-item,.cart-table,.cart-summary-box,.o-card,.stat-chip,.filters .cat-btn:not(.active),.step,.order-summary-mini,.my-order-note{
  background:var(--glass);
  -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
}
.hero{background:repeating-linear-gradient(120deg, rgba(63,107,53,.07) 0 26px, rgba(63,107,53,0) 26px 52px), var(--glass);}
.step,.order-summary-mini{background:var(--glass-tint);}
.p-thumb,.pd-image,.cart-item-name .mini-thumb,.feature .ic{background:var(--glass-tint);}
.p-card:hover{box-shadow:0 14px 36px rgba(42,35,24,.16);}
.cart-table th,.o-head{background:var(--glass-tint);}
.o-foot{background:rgba(255,255,255,.38);}
.f-field input,.f-field textarea,.f-field select,.search-box input,.admin-filters select,.admin-filters input,.o-foot select,.o-foot input,.stepper,.ship-body{
  background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border-color:rgba(255,255,255,.85);
  box-shadow:inset 0 1px 3px rgba(42,35,24,.08);
}
.f-field input[readonly]{background:rgba(236,230,210,.7);}
.ship-opt input:checked + .ship-body{background:rgba(232,240,227,.85);}
.tabs{background:var(--glass-tint);}
.tabs button.active{background:rgba(255,255,255,.85);}
footer{border-top:1px solid rgba(255,255,255,.55);}

/* ===== پنجره‌ی ویرایش سفارش ===== */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(42,35,24,.38);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);}
.modal-box{width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px;padding:26px;
  background:rgba(255,253,248,.82);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
  border:1px solid rgba(255,255,255,.8);box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-box h2{margin:0 0 16px;color:var(--leaf-dark);font-size:21px;text-align:center;}
.edit-item{display:grid;grid-template-columns:1fr auto 74px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
.edit-item input{width:100%;padding:6px 8px;border:1.5px solid var(--line);border-radius:6px;text-align:center;font-family:inherit;background:rgba(255,255,255,.7);}
.edit-total{display:flex;justify-content:space-between;font-weight:800;color:var(--leaf-dark);padding:10px 0 4px;}
.modal-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}

/* ===== سفارشات من ===== */
.my-order-note{padding:10px 14px;border-radius:8px;font-size:13px;color:var(--soil);}
.track{display:flex;gap:6px;margin:2px 0;}
.track .tk{flex:1;text-align:center;font-size:11.5px;color:var(--muted);padding-top:12px;position:relative;}
.track .tk::before{content:'';position:absolute;top:0;right:0;left:0;height:5px;border-radius:3px;background:rgba(0,0,0,.1);}
.track .tk.on{color:var(--leaf-dark);font-weight:700;}
.track .tk.on::before{background:var(--leaf);}
.cancel-banner{background:#f5dcd8;color:var(--err);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:700;}


/* ===== پروفایل (سایدبار راست در کادر) ===== */
.profile-layout{display:grid;grid-template-columns:272px 1fr;gap:22px;align-items:start;margin-top:22px;}
.profile-side{position:sticky;top:86px;padding:22px 14px 14px;border-radius:16px;
  background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
  border:1.5px solid var(--glass-border);box-shadow:var(--glass-shadow);}
.avatar{width:74px;height:74px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--leaf),var(--leaf-dark));color:#fff;font-family:'Lalezar','Vazirmatn',sans-serif;font-size:32px;
  box-shadow:0 6px 18px rgba(43,74,36,.35);border:3px solid rgba(255,255,255,.7);}
.side-name{text-align:center;font-weight:800;font-size:16px;color:var(--ink);}
.side-mobile{text-align:center;font-size:12.5px;color:var(--muted);margin:2px 0 14px;}
.side-menu{display:flex;flex-direction:column;gap:4px;border-top:1px solid rgba(0,0,0,.09);padding-top:12px;}
.side-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--soil);
  background:transparent;border:none;width:100%;text-align:right;font-family:inherit;cursor:pointer;transition:background .15s;}
.side-item svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.side-item:hover{background:rgba(255,255,255,.6);}
.side-item.active{background:var(--leaf);color:#fff;box-shadow:0 4px 12px rgba(63,107,53,.35);}
.side-item.logout{color:var(--err);margin-top:6px;border-top:1px solid rgba(0,0,0,.09);border-radius:0 0 10px 10px;padding-top:14px;}
.side-item.logout:hover{background:rgba(164,52,42,.08);}
.profile-main{min-width:0;}
.profile-pane{display:none;}
.profile-pane.active{display:block;animation:fadeIn .25s ease;}
.pane-title{font-size:24px;color:var(--leaf-dark);margin:0 0 16px;}
.pane-card{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);border-radius:14px;padding:22px 24px;margin-bottom:16px;}
.pane-card h3{font-size:19px;color:var(--leaf-dark);margin:0 0 10px;}
.pane-card p{margin:0 0 8px;font-size:14px;color:#4a4231;line-height:1.9;}
.welcome{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:linear-gradient(135deg,rgba(63,107,53,.88),rgba(43,74,36,.9));color:#fdfaf0;border:none;}
.welcome h3{color:#fff;font-size:24px;margin:0;}
.welcome p{color:#dce9d4;margin:2px 0 0;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.stat-card{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);border-radius:12px;padding:16px 10px;text-align:center;}
.stat-card .n{font-family:'Lalezar','Vazirmatn',sans-serif;font-size:28px;color:var(--leaf-dark);line-height:1.3;}
.stat-card .n.sm{font-size:19px;padding-top:6px;}
.stat-card .l{font-size:12.5px;color:var(--muted);}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.info-note{font-size:12.5px;color:var(--muted);margin:-6px 0 14px;}
.tip-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
@media (max-width:820px){
  .profile-layout{grid-template-columns:minmax(0,1fr);}
  .profile-side{position:static;min-width:0;}
  .side-menu{min-width:0;}
  .side-menu::-webkit-scrollbar{display:none;}
  .side-menu{flex-direction:row;overflow-x:auto;gap:6px;}
  .side-item{white-space:nowrap;width:auto;}
  .side-item.logout{border-top:none;margin-top:0;border-radius:10px;padding-top:11px;}
}


/* ===== مدیریت محصولات / دسته‌ها / محتوا ===== */
.p-thumb{position:relative;}
.out-badge{position:absolute;top:10px;right:10px;background:var(--err);color:#fff;font-size:11.5px;font-weight:700;padding:3px 11px;border-radius:999px;}
.p-card.out .p-thumb svg,.p-card.out .p-thumb img{opacity:.45;}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;overflow:hidden;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--glass-shadow);}
.ptable th{background:var(--soil);color:#fdf8ea;padding:10px;text-align:right;white-space:nowrap;font-weight:600;}
.ptable td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle;}
.mini-img{width:46px;height:46px;border-radius:9px;background:var(--glass-tint);color:var(--leaf);padding:9px;overflow:hidden;display:block;}
.mini-img.has-img{padding:0;}
.mini-img img{width:100%;height:100%;object-fit:cover;display:block;}
.p-actions{display:flex;gap:6px;flex-wrap:wrap;}
.pill-btn.danger{color:var(--err);border-color:var(--err);}
.pill.hiddenp{background:#e7e2d3;color:#6b634d;}
.pill.outp{background:#f5dcd8;color:var(--err);}
.pill.okp{background:#dcefd6;color:var(--leaf-dark);}
.f-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.img-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.img-prev{width:92px;height:92px;border-radius:12px;background:var(--glass-tint);color:var(--leaf);padding:18px;overflow:hidden;flex:none;}
.img-prev.has-img{padding:0;}
.img-prev img{width:100%;height:100%;object-fit:cover;display:block;}
.img-ctrl{flex:1 1 220px;display:flex;flex-direction:column;gap:8px;}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:6px 0 10px;}
.chk input{width:18px;height:18px;}
.cat-row{display:grid;grid-template-columns:44px 1fr 150px auto auto;gap:10px;align-items:center;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:10px 12px;margin-bottom:10px;}
.cat-row .cat-ic{width:40px;height:40px;color:var(--leaf);background:var(--glass-tint);border-radius:9px;padding:8px;}
.cat-row input,.cat-row select{padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;font-family:inherit;font-size:14px;background:rgba(255,255,255,.7);width:100%;}
.cat-row .cat-count{font-size:12px;color:var(--muted);white-space:nowrap;}
.cat-row .cat-btns{display:flex;gap:5px;}
.ct-group{background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;margin-bottom:12px;box-shadow:var(--glass-shadow);}
.ct-group > summary{cursor:pointer;padding:14px 18px;font-weight:800;color:var(--leaf-dark);font-size:16px;}
.ct-body{padding:2px 18px 16px;}
.ct-body .f-field textarea{min-height:64px;}
.ct-list-title{font-weight:700;font-size:13.5px;margin:10px 0 6px;color:var(--soil);}
.ct-item{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,.35);}
.ct-item .f-field{margin-bottom:8px;}
.ct-bar{position:sticky;bottom:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;padding:12px;border-radius:12px;
  background:rgba(255,253,248,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);}
@media (max-width:760px){
  .f-grid3{grid-template-columns:1fr;}
  .cat-row{grid-template-columns:40px 1fr;}
  .cat-row select,.cat-row .cat-count,.cat-row .cat-btns{grid-column:1/-1;}
}

/* ===== فاکتور چاپی ===== */
#invoicePrint{display:none;}
#invoicePrint{direction:rtl;font-family:'Vazirmatn','Tahoma',sans-serif;color:#111;background:#fff;}
.inv-frame{border:2px solid #111;padding:6px;}
.inv-inner{border:1px solid #111;padding:18px 20px;position:relative;}
.inv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
.inv-brand{font-family:'Lalezar','Vazirmatn',sans-serif;font-size:30px;line-height:1.2;}
.inv-brand small{display:block;font-family:'Vazirmatn',sans-serif;font-size:11px;color:#444;}
.inv-meta{text-align:left;font-size:12.5px;line-height:1.9;}
.inv-title{text-align:center;font-weight:800;font-size:18px;margin:12px 0;border-top:3px double #111;border-bottom:3px double #111;padding:6px 0;}
.inv-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #111;margin-bottom:12px;}
.inv-cell{padding:8px 10px;font-size:12.5px;line-height:1.9;border-bottom:1px solid #999;}
.inv-cell:nth-child(odd){border-left:1px solid #999;}
.inv-cell b{display:block;font-size:11.5px;color:#444;}
.inv-cell.full{grid-column:1/-1;border-left:none;}
.inv-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.inv-table th,.inv-table td{border:1px solid #111;padding:6px 8px;text-align:center;}
.inv-table th{background:#eee;}
.inv-table td.nm{text-align:right;}
.inv-sum{display:flex;justify-content:space-between;border:1px solid #111;border-top:none;padding:9px 12px;font-weight:800;font-size:14px;}
.inv-note{font-size:11.5px;color:#333;margin:10px 0;line-height:1.9;}
.inv-sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px;font-size:12px;}
.inv-sign div{border-top:1px solid #111;padding-top:6px;text-align:center;}
.inv-stamp{position:absolute;top:46%;right:50%;transform:translate(50%,-50%) rotate(-18deg);font-size:64px;font-weight:800;color:rgba(164,52,42,.25);border:6px solid rgba(164,52,42,.25);padding:4px 26px;border-radius:10px;}
@page{size:A4;margin:12mm;}
@media print{
  body.has-invoice{background:#fff !important;background-image:none !important;}
  body.has-invoice > *:not(#invoicePrint){display:none !important;}
  body.has-invoice #invoicePrint{display:block !important;}
}

/* ===== تصاویر وکتور محصولات ===== */
.fs-art{display:block;}
.p-thumb:has(.fs-art){padding:8px;}
.p-thumb .fs-art{width:100%;height:100%;max-height:100%;}
.pd-image:has(.fs-art){padding:16px;}
.pd-image .fs-art{width:100%;height:auto;max-width:380px;max-height:380px;}
.cart-item-name .mini-thumb:has(.fs-art){padding:2px;}
.mini-thumb .fs-art{width:100%;height:100%;}
.mini-img:has(.fs-art){padding:2px;}
.mini-img .fs-art{width:100%;height:100%;}
.img-prev:has(.fs-art){padding:3px;}
.img-prev .fs-art{width:100%;height:100%;}

#vecPicker{position:fixed;inset:0;z-index:300;background:#fdf8ea;display:flex;flex-direction:column;}
#vecPicker .vp-head{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid #e3d9bd;background:#fff;flex-wrap:wrap;}
#vecPicker .vp-head h2{margin:0;font-size:19px;color:var(--leaf-dark);flex:none;}
#vecPicker .vp-head input{flex:1;min-width:180px;padding:10px 12px;border:1px solid #d9cfae;border-radius:10px;font:inherit;}
#vecPicker .vp-body{flex:1;overflow:auto;padding:8px 18px 40px;}
#vecPicker h3{margin:22px 0 10px;font-size:15px;color:var(--leaf-dark);}
#vecPicker .vp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
#vecPicker .vp-item{background:#fff;border:2px solid #e3d9bd;border-radius:12px;padding:8px 6px 10px;cursor:pointer;font:inherit;font-size:12.5px;color:#2a2318;display:flex;flex-direction:column;align-items:center;gap:4px;}
#vecPicker .vp-item:hover{border-color:#8fbf6e;transform:translateY(-2px);}
#vecPicker .vp-item.sel{border-color:#3f6b35;box-shadow:0 0 0 3px #8fbf6e55;}
#vecPicker .vp-item svg{width:100%;height:auto;max-width:110px;}
#vecPicker .vp-empty{text-align:center;color:#7d6f4f;padding:40px 0;}

/* ===== لودینگ اولیه ===== */
.boot-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#ece6d2;transition:opacity .35s;}
.boot-loader.done{opacity:0;pointer-events:none;}
.boot-box{width:min(320px,80vw);text-align:center;}
.boot-spin{width:44px;height:44px;margin:0 auto 20px;border:4px solid rgba(0,0,0,.1);border-top-color:#555;border-radius:50%;animation:bootspin .8s linear infinite;}
.sk{height:14px;border-radius:7px;margin:10px auto;background:linear-gradient(90deg,rgba(0,0,0,.06) 25%,rgba(0,0,0,.13) 37%,rgba(0,0,0,.06) 63%);background-size:400% 100%;animation:skshimmer 1.3s ease infinite;}
.sk-w60{width:60%;}.sk-w40{width:40%;}
.boot-msg{margin-top:14px;font-size:13px;color:#7a7059;}
@keyframes bootspin{to{transform:rotate(360deg);}}
@keyframes skshimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

/* ===== حالت سایت خدماتی ===== */
.mode-service .pd-meta span:nth-child(2){display:none;}
.mode-service .out-badge{display:none;}
.svc-switch{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:0 0 14px;border-radius:10px;background:var(--glass-tint);border:1px solid var(--glass-border);font-weight:700;font-size:14px;}
.svc-switch input{width:20px;height:20px;}
</style>
</head>
<body>
<div id="bootLoader" class="boot-loader">
  <div class="boot-box">
    <div class="boot-spin"></div>
    <div class="sk sk-w60"></div>
    <div class="sk sk-w40"></div>
    <div class="boot-msg" id="bootMsg">در حال بارگذاری…</div>
  </div>
</div>

<header class="site-header">
  <div class="header-inner">
    <a href="#/" class="brand">
      <span style="font-size:24px;" id="brandLogo"></span>
      <div><span class="brand-mark" id="brandName"></span><small id="brandTag"></small></div>
    </a>
    <nav class="main-nav" id="mainNav">

<main>

  <!-- ===== خانه / محصولات ===== -->
  <section class="view" id="view-home">
    <div class="hero">
      <h1 id="heroTitle"></h1>
      <p id="heroText"></p>
    </div>
    <div class="filters" id="filters"></div>
    <div class="product-grid" id="productGrid"></div>

    <h2 class="section-title" id="whyTitle"></h2>

  <!-- ===== سبد خرید ===== -->

    <div id="cartBody"></div>
  </section>

  <!-- ===== ثبت سفارش ===== -->
  <section class="view" id="view-checkout">
    <div class="form-card" style="max-width:640px;">

      <div class="order-summary-mini" id="checkoutSummary"></div>
      <form id="checkoutForm" novalidate>

        <div class="f-field">

  <!-- ===== موفقیت سفارش ===== -->

      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;">

/* ---------- CSV / Google Sheet ---------- */
function parseCSV(str){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i=0;i<str.length;i++){
    const c = str[i];
    if (inQuotes){
      if (c === '"'){ if (str[i+1] === '"'){ field+='"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field=''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
async function loadConfig(){
  const url = `https://docs.google.com/spreadsheets/d/e/${PUBLISHED_ID}/pub?output=csv&gid=${SHEET_GID}`;
  let res;
  try{ res = await fetch(url); }
  catch(e){ throw new Error('اتصال به گوگل‌شیت برقرار نشد — اینترنت/VPN را بررسی کن'); }
  if (!res.ok) throw new Error('گوگل‌شیت در دسترس نیست — مطمئن شو Publish to web فعال است');
  const bodyText = await res.text();
  if (bodyText.trim().startsWith('<')) throw new Error('این لینک CSV برنمی‌گردونه — Publish to web را چک کن');
  const rows = parseCSV(bodyText);
  const cell = (rows[CONFIG_ROW-1] && rows[CONFIG_ROW-1][CONFIG_COL]) ? rows[CONFIG_ROW-1][CONFIG_COL].trim() : '';
  const [repoFull, fileName, branch, token] = cell.split(',').map(s=>s.trim());
  if (!repoFull || !fileName || !branch || !token) throw new Error('محتوای خونه B6 ناقص یا با فرمت اشتباه است');
  const [owner, repo] = repoFull.split('/');
  return { owner, repo, fileName, branch, token };
}

/* ---------- GitHub helpers ---------- */
function b64EncodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUtf8(str){ return decodeURIComponent(escape(atob(str))); }

async function ghGetFile(path, asObject){
  const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}?ref=${CONFIG.branch}`;
  const headers = { 'Authorization': `token ${CONFIG.token}` };
  const empty = asObject ? {} : [];
  let res;
  try{ res = await fetch(url, { headers }); }
  catch(e){ throw new Error('اتصال به GitHub برقرار نشد'); }
  if (res.status === 404) return { data: empty, sha: null };
  if (!res.ok) throw new Error('خطا در خواندن از گیت‌هاب: ' + res.status);
  const file = await res.json();
  let text = '';
  if (file.content){ try{ text = b64DecodeUtf8(file.content.replace(/\n/g,'')); } catch(e){ text = ''; } }
  else if (file.sha){
    try{ const r2 = await fetch(url, { headers: { ...headers, 'Accept': 'application/vnd.github.raw+json' } }); if (r2.ok) text = await r2.text(); } catch(e){}
  }
  let data = empty;
  try{ data = JSON.parse(text); } catch(e){ data = empty; }
  const okType = asObject ? (data && typeof data === 'object' && !Array.isArray(data)) : Array.isArray(data);
  if (!okType) data = empty;
  return { data, sha: file.sha };
}
async function ghPutFile(path, data, sha, message){
  const body = { message, content: b64EncodeUtf8(JSON.stringify(data, null, 2)), branch: CONFIG.branch };
  if (sha) body.sha = sha;
  let res;
  try{
    res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`, {
      method:'PUT',
      headers:{ 'Authorization': `token ${CONFIG.token}`, 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    });
  } catch(e){ throw new Error('اتصال به GitHub برقرار نشد'); }
  if (!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.message || ('خطا: ' + res.status)); }
  return res.json();
}
async function ghAppend(path, record, message){
  const { data, sha } = await ghGetFile(path);
  data.push(record);
  await ghPutFile(path, data, sha, message);
  return data;
}

async function hashPassword(pw){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

const EN_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const FA_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function gregorianToJalali(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053); days %= 12053;
  jy += 4*Math.floor(days/1461); days %= 1461;
  jy += Math.floor((days-1)/365); if (days > 365) days = (days-1)%365;
  const jm = (days < 186) ? 1+Math.floor(days/31) : 7+Math.floor((days-186)/30);
  const jd = 1 + ((days < 186) ? (days%31) : ((days-186)%30));
  return `${jd} ${FA_MONTHS[jm-1]} ${jy}`;
}
function nowJalali(){ const d=new Date(); return gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate()); }
function fmtPrice(n){ return Number(n||0).toLocaleString('fa-IR'); }

  const pool = ['box','gift','shoppingbag','tag','star','globe','document','coins'];
  let h = 0; s = String(s||''); for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;

window.openVectorPicker = function(current, onPick){
  let ov = document.getElementById('vecPicker'); if (ov) ov.remove();
  ov = document.createElement('div'); ov.id = 'vecPicker';
  const used = new Set(); FS_ART_GROUPS.forEach(g=>g[1].forEach(k=>used.add(k)));
  const rest = Object.keys(FS_ART).filter(k=>!used.has(k));
  const groups = rest.length ? FS_ART_GROUPS.concat([['سایر', rest]]) : FS_ART_GROUPS;
  ov.innerHTML = `<div class="vp-head"><h2>انتخاب تصویر وکتور</h2><input type="search" id="vpSearch" placeholder="جستجو… (مثلاً: کفش، گاو، عسل)"><button type="button" class="btn outline" id="vpClose">بستن</button></div><div class="vp-body" id="vpBody"></div>`;
  document.body.appendChild(ov);
  const body = ov.querySelector('#vpBody');
  const render = q=>{
    q = fsNorm(q||'');
    body.innerHTML = groups.map(([title, keys])=>{
      const ks = keys.filter(k=>FS_ART[k] && (!q || fsNorm(FS_ART_LABELS[k]||k).includes(q) || k.includes(q.toLowerCase())));
      if (!ks.length) return '';
      return `<h3>${title}</h3><div class="vp-grid">${ks.map(k=>`<button type="button" class="vp-item ${current==='vector:'+k?'sel':''}" data-k="${k}"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${FS_ART[k]()}</svg><span>${FS_ART_LABELS[k]||k}</span></button>`).join('')}</div>`;
    }).join('') || '<p class="vp-empty">وکتوری با این نام پیدا نشد.</p>';
  };
  render('');
  const close = ()=>ov.remove();
  ov.querySelector('#vpClose').onclick = close;
  ov.querySelector('#vpSearch').oninput = e=>render(e.target.value);
  body.onclick = e=>{ const b = e.target.closest('.vp-item'); if (!b) return; onPick('vector:' + b.dataset.k); close(); };

};

function productArt(p){
  const mv = (p && typeof p.image === 'string' && p.image.indexOf('vector:') === 0) ? p.image.slice(7) : '';

  return `<svg class="fs-art" viewBox="0 0 200 200" role="img" aria-label="${title}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;

/* ---------- سبد خرید ---------- */
function saveCart(){ localStorage.setItem('fs_cart', JSON.stringify(CART)); updateCartBadge(); }
function cartQty(id){ const it = CART.find(c=>c.id===id); return it ? it.qty : 0; }
function addToCart(id, qty){
  qty = Math.max(1, qty|0);
  const it = CART.find(c=>c.id===id);
  if (it) it.qty += qty; else CART.push({ id, qty });
  saveCart();
}
function setCartQty(id, qty){
  qty = qty|0;
  if (qty <= 0){ CART = CART.filter(c=>c.id!==id); }
  else { const it = CART.find(c=>c.id===id); if (it) it.qty = qty; }
  saveCart();
}
function removeFromCart(id){ CART = CART.filter(c=>c.id!==id); saveCart(); }
function cartLines(){
  return CART.map(c=>{
    const p = PRODUCTS.find(p=>p.id===c.id && !p.hidden);
    if (!p) return null;
    return { product:p, qty:c.qty, lineTotal: p.price * c.qty };
  }).filter(Boolean);
}
function cartTotal(){ return cartLines().reduce((s,l)=>s+l.lineTotal,0); }
function cartCount(){ return CART.reduce((s,c)=>s+c.qty,0); }
function updateCartBadge(){ document.getElementById('cartBadge').textContent = cartCount(); }

/* ---------- روتر ---------- */
function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.main-nav a').forEach(a=>a.classList.remove('active'));
  window.scrollTo({top:0, behavior:'smooth'});
}
function route(){
  const hash = location.hash || '#/';
  const parts = hash.replace(/^#\/?/, '').split('/').filter(Boolean);

  if (parts[0] === 'product' && parts[1]){
    renderProductDetail(parts[1]); showView('view-product'); return;
  }
  if (parts[0] === 'cart'){ renderCart(); showView('view-cart'); return; }
  if (parts[0] === 'checkout'){
    if (!CUSTOMER){ sessionStorage.setItem('fs_after_login', '#/checkout'); location.hash = '#/account'; return; }
    renderCheckout(); showView('view-checkout'); return;
  }
  if (parts[0] === 'order-success'){ showView('view-order-success'); return; }
  if (parts[0] === 'account'){
    if (CUSTOMER){ renderProfile(parts[1]); showView('view-profile'); return; }
    if (parts[1]) sessionStorage.setItem('fs_after_login', '#/account/' + parts[1]);
    renderAccount(); showView('view-account'); return;
  }
  if (parts[0] === 'my-orders'){ location.hash = '#/account/orders'; return; }
  if (parts[0] === 'about'){ renderContact(); showView('view-about'); return; }
  if (parts[0] === 'admin'){
    if (!isAdmin()){ location.hash = '#/account'; return; }
    renderAdmin(parts[1]); showView('view-admin'); return;
  }
  renderHome(); showView('view-home');
}
window.addEventListener('hashchange', route);

/* ---------- خانه / کاتالوگ ---------- */
let activeCategory = 'all';
let searchTerm = '';
function visibleProducts(){ return PRODUCTS.filter(p=>!p.hidden); }
function renderFilters(){
  const used = new Set(visibleProducts().map(p=>p.category));
  const cats = CATEGORIES.filter(c=>used.has(c.id));
  if (activeCategory !== 'all' && !cats.some(c=>c.id===activeCategory)) activeCategory = 'all';
  const box = document.getElementById('filters');
  box.innerHTML = [{id:'all',label:'همه محصولات'}, ...cats].map(c=>`<button type="button" class="cat-btn ${c.id===activeCategory?'active':''}" data-cat="${esc(c.id)}">${esc(c.label)}</button>`).join('')
    + `<div class="search-box"><input type="text" id="searchInput" placeholder="جستجوی محصول..." value="${esc(searchTerm)}"></div>`;
  box.querySelectorAll('.cat-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeCategory = btn.dataset.cat; renderHome(); });
  });
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchTerm = e.target.value; renderProductGrid();
  });
}
function renderProductGrid(){
  let list = visibleProducts();
  const grid = document.getElementById('productGrid');
  if (!list.length){ grid.innerHTML = `<div class="empty-state">هنوز محصولی در فروشگاه ثبت نشده است.</div>`; return; }
  if (activeCategory !== 'all') list = list.filter(p=>p.category===activeCategory);
  if (searchTerm.trim()) list = list.filter(p=>p.name.includes(searchTerm.trim()));
  if (!list.length){ grid.innerHTML = `<div class="empty-state">محصولی یافت نشد.</div>`; return; }
  grid.innerHTML = list.map(p=>`
    <a href="#/product/${esc(p.id)}" class="p-card ${inStock(p)?'':'out'}">
      <div class="p-thumb">${productThumb(p)}${inStock(p)?'':'<span class="out-badge">ناموجود</span>'}</div>
      <div class="p-body">
        <div class="p-cat">${esc(categoryLabel(p.category))}</div>
        <div class="p-name">${esc(p.name)}</div>
        <div class="p-price">${fmtPrice(p.price)} تومان <span class="p-unit">/ ${esc(p.unit||'')}</span></div>
      </div>
    </a>`).join('');
}
function renderHome(){ renderFilters(); renderProductGrid(); }

/* ---------- جزئیات محصول ---------- */
function renderProductDetail(id){
  const p = PRODUCTS.find(p=>p.id===id && !p.hidden);
  const body = document.getElementById('productDetailBody');
  if (!p){ body.innerHTML = `<div class="empty-state">محصول پیدا نشد.</div>`; return; }
  const ok = inStock(p);
  const stockTxt = !ok ? 'ناموجود' : (maxQty(p) === Infinity ? 'موجود' : `${fmtPrice(p.stock)} ${p.unit?('('+esc(p.unit)+')'):''}`);
  body.innerHTML = `
    <div class="product-detail">
      <div class="pd-image">${productThumb(p)}</div>
      <div class="pd-info">
        <div class="pd-cat">${esc(categoryLabel(p.category))}</div>
        <h2 class="pd-name">${esc(p.name)}</h2>
        <div class="pd-price">${fmtPrice(p.price)} تومان <span class="p-unit">/ ${esc(p.unit||'')}</span></div>
        <div class="pd-meta">
          <span>کد کالا: ${esc(p.sku||'—')}</span>
          <span>موجودی: ${stockTxt}</span>
        </div>
        <p class="pd-desc">${para(p.description||'')}</p>
        <div class="qty-row">
          <div class="stepper">
            <button type="button" id="pdMinus">−</button>
            <input type="text" id="pdQty" value="1" inputmode="numeric">
            <button type="button" id="pdPlus">+</button>
          </div>
          <button class="btn" id="pdAddBtn" ${ok?'':'disabled'}>${ok?'افزودن به سبد خرید':'ناموجود'}</button>
        </div>
        <div class="status" id="pdStatus"></div>
      </div>
    </div>`;
  const qtyEl = document.getElementById('pdQty');
  document.getElementById('pdMinus').onclick = ()=>{ qtyEl.value = Math.max(1, (parseInt(qtyEl.value)||1)-1); };
  document.getElementById('pdPlus').onclick = ()=>{ qtyEl.value = (parseInt(qtyEl.value)||1)+1; };
  document.getElementById('pdAddBtn').onclick = ()=>{
    const st = document.getElementById('pdStatus');
    const want = parseInt(qtyEl.value)||1;
    if (cartQty(p.id) + want > maxQty(p)){
      st.className = 'status bad'; st.textContent = `حداکثر موجودی این کالا ${fmtPrice(maxQty(p))} عدد است (در سبد شما ${fmtPrice(cartQty(p.id))} عدد).`; return;
    }
    addToCart(p.id, want);
    st.className = 'status ok'; st.textContent = 'به سبد خرید اضافه شد.';
  };
}

/* ---------- سبد خرید ---------- */
function renderCart(){
  const lines = cartLines();
  const body = document.getElementById('cartBody');
  if (!lines.length){
    body.innerHTML = `<div class="empty-state">سبد خرید شما خالی است. <br><a href="#/" class="btn" style="display:inline-block;margin-top:14px;">مشاهده محصولات</a></div>`;
    return;
  }
  body.innerHTML = `
    <table class="cart-table">
      <thead><tr><th>محصول</th><th>قیمت واحد</th><th>تعداد</th><th>جمع</th><th></th></tr></thead>
      <tbody>
        ${lines.map(l=>`
          <tr data-id="${l.product.id}">
            <td><div class="cart-item-name"><div class="mini-thumb">${productThumb(l.product)}</div>${esc(l.product.name)}</div></td>
            <td>${fmtPrice(l.product.price)} تومان</td>
            <td>
              <div class="stepper" style="display:inline-flex;">
                <button type="button" class="ct-minus">−</button>
                <input type="text" class="ct-qty" value="${l.qty}" inputmode="numeric">
                <button type="button" class="ct-plus">+</button>
              </div>
            </td>
            <td>${fmtPrice(l.lineTotal)} تومان</td>
            <td><button type="button" class="cart-remove">حذف</button></td>
          </tr>`).join('')}
      </tbody>
    </table>
    <div class="cart-summary">
      <div class="cart-summary-box">
        <div class="row"><span>تعداد اقلام</span><span>${cartCount()}</span></div>
        <div class="row total"><span>جمع کل</span><span>${fmtPrice(cartTotal())} تومان</span></div>
      </div>
    </div>
    <div class="cart-actions">
      <a href="#/checkout" class="btn gold">${CUSTOMER ? 'ادامه و ثبت سفارش' : 'ورود به حساب و ادامه ثبت سفارش'}</a>
    </div>`;

  body.querySelectorAll('tr[data-id]').forEach(row=>{
    const id = row.dataset.id;
    row.querySelector('.ct-minus').onclick = ()=>{ setCartQty(id, cartQty(id)-1); renderCart(); };
    row.querySelector('.ct-plus').onclick = ()=>{ const pr = PRODUCTS.find(x=>x.id===id); if (pr && cartQty(id)+1 > maxQty(pr)) return; setCartQty(id, cartQty(id)+1); renderCart(); };
    row.querySelector('.ct-qty').onchange = (e)=>{ setCartQty(id, parseInt(e.target.value)||0); renderCart(); };
    row.querySelector('.cart-remove').onclick = ()=>{ removeFromCart(id); renderCart(); };
  });
}

/* ---------- کمک به اعتبارسنجی فرم‌ها ---------- */
function setFErr(input, msg){
  const box = input.parentElement.querySelector('.f-err');
  if (box) box.textContent = msg || '';
  input.style.borderColor = msg ? 'var(--err)' : 'var(--line)';
}
const mobileRe = /^09\d{9}$/;

/* ---------- تسویه حساب / ثبت سفارش ---------- */
function selectedShip(){ const r = document.querySelector('input[name="shipMethod"]:checked'); return r ? r.value : null; }
function applyShipUI(){
  const m = selectedShip();
  const needs = m ? SHIP_METHODS[m].needsAddress : false;
  document.getElementById('addrGroup').style.display = needs ? 'block' : 'none';
  const note = document.getElementById('shipNote');
  if (!m){ note.style.display='none'; return; }
  note.style.display = 'block';
  note.textContent = needs
    ? CONTENT.shipNoteShip
    : (CONTENT.shipNotePickup + (STORE_INFO.address ? ' آدرس: ' + STORE_INFO.address : ''));
}
function renderCheckout(){
  if (!cartLines().length){ location.hash = '#/cart'; return; }
  const sum = document.getElementById('checkoutSummary');
  sum.innerHTML = cartLines().map(l=>`<div class="row"><span>${esc(l.product.name)} × ${l.qty}</span><span>${fmtPrice(l.lineTotal)} تومان</span></div>`).join('')
    + `<div class="row total"><span>جمع کل کالاها</span><span>${fmtPrice(cartTotal())} تومان</span></div>`;
  const prev = selectedShip();
  document.getElementById('shipOptions').innerHTML = Object.entries(SHIP_METHODS).map(([k,v])=>`
    <label class="ship-opt"><input type="radio" name="shipMethod" value="${k}" ${prev===k?'checked':''}>
      <span class="ship-body"><b>${v.label}</b><small>${v.desc}</small></span></label>`).join('');
  document.querySelectorAll('input[name="shipMethod"]').forEach(r=>r.addEventListener('change', ()=>{ document.getElementById('shipErr').textContent=''; applyShipUI(); }));
  if (CUSTOMER){
    const n = document.getElementById('coName'), m = document.getElementById('coMobile'), a = document.getElementById('coAddress');
    if (!n.value) n.value = CUSTOMER.name || '';
    if (!m.value) m.value = CUSTOMER.mobile || '';
    if (!a.value) a.value = CUSTOMER.address || '';
    const pv = document.getElementById('coProvince'), ct = document.getElementById('coCity'), pc = document.getElementById('coPostal');
    if (!pv.value) pv.value = CUSTOMER.province || '';
    if (!ct.value) ct.value = CUSTOMER.city || '';
    if (!pc.value) pc.value = CUSTOMER.postal || '';
  }
  applyShipUI();
}
document.getElementById('checkoutForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const statusBox = document.getElementById('checkoutStatus');
  statusBox.className = 'status'; statusBox.textContent = '';
  if (!CUSTOMER){ sessionStorage.setItem('fs_after_login','#/checkout'); location.hash = '#/account'; return; }

  const name = document.getElementById('coName');
  const mobile = document.getElementById('coMobile');
  const province = document.getElementById('coProvince');
  const city = document.getElementById('coCity');
  const postal = document.getElementById('coPostal');
  const address = document.getElementById('coAddress');
  const notes = document.getElementById('coNotes');
  const method = selectedShip();

  let ok = true;
  if (!method){ document.getElementById('shipErr').textContent = 'روش دریافت سفارش را انتخاب کنید'; ok=false; } else document.getElementById('shipErr').textContent = '';
  if (!name.value.trim()){ setFErr(name,'نام را وارد کنید'); ok=false; } else setFErr(name,'');
  if (!mobileRe.test(mobile.value.trim())){ setFErr(mobile,'شماره موبایل معتبر نیست'); ok=false; } else setFErr(mobile,'');
  const needs = method && SHIP_METHODS[method].needsAddress;
  if (needs){
    if (!province.value.trim()){ setFErr(province,'استان را وارد کنید'); ok=false; } else setFErr(province,'');
    if (!city.value.trim()){ setFErr(city,'شهر را وارد کنید'); ok=false; } else setFErr(city,'');
    if (!/^\d{10}$/.test(postal.value.trim())){ setFErr(postal,'کد پستی ۱۰ رقمی معتبر نیست'); ok=false; } else setFErr(postal,'');
    if (!address.value.trim()){ setFErr(address,'آدرس را وارد کنید'); ok=false; } else setFErr(address,'');
  }
  if (!ok){
    statusBox.className = 'status bad';
    statusBox.textContent = 'فرم ناقص یا نادرست است — موارد قرمزرنگ را اصلاح کنید.';
    return;
  }

  const btn = document.getElementById('checkoutBtn');
  btn.disabled = true; btn.textContent = 'در حال ثبت...';
  try{
    if (!CONFIG) CONFIG = await loadConfig();
    const order = {
      id: Date.now(),
      date: nowJalali(),
      time: nowTime(),
      account: { name: CUSTOMER.name, mobile: CUSTOMER.mobile },
      receiver: { name: name.value.trim(), mobile: mobile.value.trim() },
      shipping: { method, label: SHIP_METHODS[method].label },
      address: needs ? { province: province.value.trim(), city: city.value.trim(), postalCode: postal.value.trim(), full: address.value.trim() } : null,
      notes: withWhen(notes.value.trim()),
      items: cartLines().map(l=>({ id:l.product.id, name:l.product.name, price:l.product.price, qty:l.qty, lineTotal:l.lineTotal })),
      total: cartTotal(),
      status: 'pending',
      trackingCode: '',
      history: [{ status:'pending', date: nowJalali(), time: nowTime() }]
    };
    await ghAppend(CONFIG.fileName, order, `سفارش جدید: ${order.receiver.name}`);
    document.getElementById('orderSuccessText').textContent =
      `سفارش شما به مبلغ ${fmtPrice(order.total)} تومان ثبت شد. ` +

function normOrder(o){
  const receiver = o.receiver || o.customer || {};
  const account = o.account || o.customer || {};
  const shipping = o.shipping || { method:null, label:'ثبت‌نشده' };
  const addr = (o.address && typeof o.address === 'object') ? o.address : (o.customer && o.customer.address ? { full:o.customer.address } : null);
  const notes = (o.notes !== undefined) ? o.notes : (o.customer ? o.customer.notes : '');
  return { raw:o, edited:!!o.edited, canceledBy:o.canceledBy||'', id:o.id, date:o.date, time:o.time, receiver, account, shipping, addr, notes, items:o.items||[], total:o.total, status:o.status||'pending', trackingCode:o.trackingCode||'', history:o.history||[] };
}
function shippingText(o){
  const lines = [`گیرنده: ${o.receiver.name||'—'} — ${o.receiver.mobile||'—'}`, `روش ارسال: ${o.shipping.label}`];
  if (o.addr){
    const loc = [o.addr.province, o.addr.city].filter(Boolean).join('، ');
    if (loc) lines.push(`استان/شهر: ${loc}`);
    if (o.addr.full) lines.push(`آدرس: ${o.addr.full}`);
    if (o.addr.postalCode) lines.push(`کد پستی: ${o.addr.postalCode}`);
  } else if (isNoShip(o.shipping.method)) lines.push('تحویل حضوری از فروشگاه');
  return lines.join('\n');
}

/* وضعیت‌هایی که موجودی کالا برایشان کم شده است (از «در حال آماده‌سازی» به بعد) */
const STOCK_RESERVED = ['preparing','shipped','done'];
async function updateOrder(oid, patch){
  if (!CONFIG) CONFIG = await loadConfig();
  const { data, sha } = await ghGetFile(CONFIG.fileName);
  const o = data.find(x=>String(x.id)===String(oid));
  if (!o) throw new Error('سفارش پیدا نشد');
  const changed = (o.status || 'pending') !== patch.status;

  /* ---- موجودی: کسر در آماده‌سازی، برگشت در لغو / بازگشت به انتظار ---- */
  let stockUndo = null, shortages = [];
  const wantReserved = STOCK_RESERVED.includes(patch.status);
  if (wantReserved && !o.stockMoves){
    let moves = [];
    await saveProducts(arr=>{
      moves = []; shortages = [];
      (o.items||[]).forEach(it=>{
        const p = arr.find(x=>x.id===it.id);
        if (!p || p.stock === null || p.stock === undefined || p.stock === '') return; // موجودی نامحدود
        const cur = Number(p.stock) || 0, want = Number(it.qty) || 0;
        const take = Math.min(cur, want);
        if (take < want) shortages.push(`${it.name} (موجودی ${cur}، سفارش ${want})`);
        p.stock = cur - take;
        if (take > 0) moves.push({ id: p.id, qty: take });
      });
    });
    o.stockMoves = moves;
    stockUndo = arr=>{ moves.forEach(m=>{ const p = arr.find(x=>x.id===m.id); if (p) p.stock = (Number(p.stock)||0) + m.qty; }); };
  } else if (!wantReserved && o.stockMoves){
    const moves = o.stockMoves;
    await saveProducts(arr=>{
      moves.forEach(m=>{ const p = arr.find(x=>x.id===m.id); if (p && p.stock !== null && p.stock !== undefined && p.stock !== '') p.stock = (Number(p.stock)||0) + m.qty; });
    });
    delete o.stockMoves;
    stockUndo = arr=>{ moves.forEach(m=>{ const p = arr.find(x=>x.id===m.id); if (p) p.stock = (Number(p.stock)||0) - m.qty; }); };
  }

  o.status = patch.status;
  o.trackingCode = patch.trackingCode;
  if (changed){ o.history = o.history || []; o.history.push({ status: patch.status, date: nowJalali(), time: nowTime() }); }
  try{
    await ghPutFile(CONFIG.fileName, data, sha, `بروزرسانی سفارش ${oid}`);
  } catch(err){
    /* ذخیره‌ی سفارش شکست خورد → موجودی را به حالت قبل برگردان */
    if (stockUndo){ try{ await saveProducts(arr=>{ stockUndo(arr); }); } catch(e){} }
    throw err;
  }
  ordersCache = data; ordersSha = null;
  return { shortages };
}

function histText(o){
  if (!o.history.length) return '';
  return o.history.map(h=>{
    const what = h.note ? h.note : statusLabel(h.status, o.shipping.method);
    const by = h.by === 'customer' ? ' توسط مشتری' : '';
    return `${esc(what)}${by} (${esc(h.date||'')} ${esc(h.time||'')})`;
  }).join(' ← ');
}

  </div></div>`;
}
function printInvoice(o){
  const old = document.getElementById('invoicePrint'); if (old) old.remove();
  const el = document.createElement('div');
  el.id = 'invoicePrint'; el.innerHTML = invoiceHtml(o);
  document.body.appendChild(el);
  document.body.classList.add('has-invoice');
  const cleanup = ()=>{ window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  setTimeout(()=>{ try{ window.print(); }catch(e){} }, 60);
}

/* ---------- سفارشات من (مشتری) ---------- */
let myOrders = [];
async function fetchMyOrders(){
  if (!CONFIG) CONFIG = await loadConfig();
  const { data } = await ghGetFile(CONFIG.fileName);
  myOrders = data.map(normOrder).filter(o=>o.account.mobile === CUSTOMER.mobile).reverse();
  return myOrders;
}
async function loadMyOrders(){
  const body = document.getElementById('myOrdersBody');
  body.innerHTML = '<div class="empty-state">در حال بارگذاری...</div>';
  try{
    await fetchMyOrders();
    renderMyOrders();
  } catch(err){
    body.innerHTML = `<div class="status bad" style="display:block;">${esc(err.message)}</div>`;
  }
}
function trackHtml(o){
  if (o.status === 'canceled') return `<div class="cancel-banner">این سفارش لغو شده است${o.canceledBy==='customer' ? ' (توسط شما)' : ''}.</div>`;
  const steps = ['pending','preparing','shipped','done'];
  const idx = steps.indexOf(o.status);
  return `<div class="track">${steps.map((s,i)=>`<div class="tk ${i<=idx?'on':''}">${statusLabel(s, o.shipping.method)}</div>`).join('')}</div>`;
}
function renderMyOrders(){
  const body = document.getElementById('myOrdersBody');
  if (!myOrders.length){
    body.innerHTML = `<div class="empty-state">هنوز سفارشی ثبت نکرده‌اید.<br><a href="#/" class="btn" style="display:inline-block;margin-top:14px;">مشاهده محصولات</a></div>`;
    return;
  }
  body.innerHTML = myOrders.map(o=>{
    const pending = o.status === 'pending';
    const isPickup = isNoShip(o.shipping.method);
    const addr = o.addr
      ? `${esc([o.addr.province,o.addr.city].filter(Boolean).join('، '))}${o.addr.full ? '<br>' + esc(o.addr.full) : ''}${o.addr.postalCode ? '<br>کد پستی: ' + esc(o.addr.postalCode) : ''}`
      : (isPickup ? 'تحویل حضوری از فروشگاه' : '—');
    const hist = histText(o);
    return `
    <div class="o-card" data-oid="${esc(o.id)}">
      <div class="o-head">
        <div><span class="o-id">سفارش ${esc(String(o.id).slice(-6))}</span> <span class="o-date">${esc(o.date||'')} ${esc(o.time||'')}</span></div>
        <div class="o-pills">
          <span class="pill ship">${esc(o.shipping.label)}</span>
          ${o.edited ? '<span class="pill preparing">ویرایش‌شده</span>' : ''}
          <span class="pill ${o.status==='pending'?'pending':o.status}">${statusLabel(o.status, o.shipping.method)}</span>
        </div>
      </div>
      <div class="o-body">
        <div class="o-sec full">${trackHtml(o)}</div>
        <div class="o-sec"><h4>تحویل‌گیرنده</h4><p>${esc(o.receiver.name||'—')}<br>${esc(o.receiver.mobile||'—')}</p></div>
        <div class="o-sec"><h4>${isPickup?'نحوه‌ی دریافت':'آدرس ارسال'}</h4><p>${addr}</p></div>
        ${o.trackingCode ? `<div class="o-sec full"><h4>کد رهگیری</h4><p><b>${esc(o.trackingCode)}</b></p></div>` : ''}
        ${o.notes ? `<div class="o-sec full"><h4>توضیحات</h4><p>${esc(o.notes)}</p></div>` : ''}
        <div class="o-sec full"><h4>اقلام سفارش</h4>
          <table class="o-items"><thead><tr><th>کالا</th><th>تعداد</th><th>قیمت واحد</th><th>جمع</th></tr></thead><tbody>
            ${o.items.map(it=>`<tr><td>${esc(it.name)}</td><td>${fmtPrice(it.qty)}</td><td>${fmtPrice(it.price)}</td><td>${fmtPrice(it.lineTotal ?? (it.price*it.qty))}</td></tr>`).join('')}
          </tbody></table>
          <div class="o-total"><span>جمع کل کالاها</span><span>${fmtPrice(o.total)} تومان</span></div>
        </div>
        ${hist ? `<div class="o-sec full o-hist">سابقه: ${hist}</div>` : ''}
        ${(!pending && o.status!=='canceled') ? `<div class="o-sec full"><div class="my-order-note">این سفارش از مرحله‌ی «در انتظار تأیید» عبور کرده و دیگر قابل ویرایش یا لغو نیست. برای تغییر، با فروشگاه تماس بگیرید.</div></div>` : ''}
      </div>
      <div class="o-foot">
        <button type="button" class="pill-btn mo-print">چاپ فاکتور</button>
        ${pending ? '<button type="button" class="pill-btn save mo-edit">ویرایش سفارش</button><button type="button" class="pill-btn mo-cancel" style="color:var(--err);border-color:var(--err);">لغو سفارش</button>' : ''}
      </div>
    </div>`;
  }).join('');

  body.querySelectorAll('.o-card').forEach(card=>{
    const oid = card.dataset.oid;
    const o = myOrders.find(x=>String(x.id)===String(oid));
    card.querySelector('.mo-print').onclick = ()=>printInvoice(o);
    const ed = card.querySelector('.mo-edit'); if (ed) ed.onclick = ()=>openEditModal(oid);
    const cn = card.querySelector('.mo-cancel');
    if (cn) cn.onclick = async ()=>{
      if (!confirm('سفارش لغو شود؟ این کار قابل بازگشت نیست.')) return;
      cn.disabled = true; cn.textContent = 'در حال لغو...';
      try{
        await customerMutateOrder(oid, ord=>{
          ord.status = 'canceled'; ord.canceledBy = 'customer';
          ord.history = ord.history || [];
          ord.history.push({ status:'canceled', date:nowJalali(), time:nowTime(), by:'customer' });
        });
        await loadMyOrders();
      } catch(err){ alert(err.message); cn.disabled = false; cn.textContent = 'لغو سفارش'; await loadMyOrders(); }
    };
  });
}

async function customerMutateOrder(oid, mutate){
  if (!CUSTOMER) throw new Error('ابتدا وارد حساب شوید');
  if (!CONFIG) CONFIG = await loadConfig();
  const { data, sha } = await ghGetFile(CONFIG.fileName);
  const ord = data.find(x=>String(x.id)===String(oid));
  if (!ord) throw new Error('سفارش پیدا نشد');
  const n = normOrder(ord);
  if (n.account.mobile !== CUSTOMER.mobile) throw new Error('این سفارش متعلق به حساب شما نیست');
  if ((ord.status || 'pending') !== 'pending') throw new Error('وضعیت این سفارش تغییر کرده و دیگر «در انتظار تأیید» نیست؛ امکان تغییر وجود ندارد.');
  mutate(ord);
  await ghPutFile(CONFIG.fileName, data, sha, `تغییر سفارش ${oid} توسط مشتری`);
}

function closeEditModal(){ document.getElementById('editModal').style.display = 'none'; }
document.getElementById('editModal').addEventListener('click', e=>{ if (e.target.id === 'editModal') closeEditModal(); });
document.addEventListener('keydown', e=>{ if (e.key === 'Escape') closeEditModal(); });

function openEditModal(oid){
  const o = myOrders.find(x=>String(x.id)===String(oid));
  if (!o) return;
  const box = document.getElementById('editModalBox');
  const cur = o.shipping.method;
  const a = o.addr || {};
  box.innerHTML = `
    <h2>ویرایش سفارش ${esc(String(o.id).slice(-6))}</h2>
    <form id="editForm" novalidate>
      <div class="f-field">
        <label>روش دریافت سفارش<span class="req">*</span></label>
        <div class="ship-options">${Object.entries(SHIP_METHODS).map(([k,v])=>`
          <label class="ship-opt"><input type="radio" name="editShip" value="${k}" ${cur===k?'checked':''}>
          <span class="ship-body"><b>${v.label}</b><small>${v.desc}</small></span></label>`).join('')}</div>
        <div class="f-err" id="editShipErr"></div>
      </div>
      <div class="f-row2">
        <div class="f-field"><label>نام تحویل‌گیرنده<span class="req">*</span></label><input type="text" id="editName" value="${esc(o.receiver.name||'')}"><div class="f-err"></div></div>
        <div class="f-field"><label>موبایل تحویل‌گیرنده<span class="req">*</span></label><input type="tel" id="editMobile" inputmode="numeric" value="${esc(o.receiver.mobile||'')}"><div class="f-err"></div></div>
      </div>
      <div id="editAddrGroup" style="display:none;">
        <div class="f-row2">
          <div class="f-field"><label>استان<span class="req">*</span></label><input type="text" id="editProvince" value="${esc(a.province||'')}"><div class="f-err"></div></div>
          <div class="f-field"><label>شهر<span class="req">*</span></label><input type="text" id="editCity" value="${esc(a.city||'')}"><div class="f-err"></div></div>
        </div>
        <div class="f-field"><label>کد پستی (۱۰ رقم)<span class="req">*</span></label><input type="text" id="editPostal" inputmode="numeric" maxlength="10" value="${esc(a.postalCode||'')}"><div class="f-err"></div></div>
        <div class="f-field"><label>آدرس کامل<span class="req">*</span></label><textarea id="editAddress">${esc(a.full||'')}</textarea><div class="f-err"></div></div>
      </div>
      <div class="f-field"><label>توضیحات سفارش</label><textarea id="editNotes">${esc(o.notes||'')}</textarea></div>
      <div class="f-field">
        <label>اقلام (تعداد ۰ = حذف کالا)</label>
        ${o.items.map((it,i)=>`<div class="edit-item"><span>${esc(it.name)}</span><span>${fmtPrice(it.price)} تومان</span><input type="number" min="0" class="edit-qty" data-idx="${i}" value="${it.qty}"></div>`).join('')}
        <div class="edit-total"><span>جمع کل</span><span id="editTotal">${fmtPrice(o.total)} تومان</span></div>
        <div class="f-err" id="editItemsErr"></div>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn gold" id="editSaveBtn">ذخیره تغییرات</button>
        <button type="button" class="btn outline" id="editCancelBtn">انصراف</button>
      </div>
      <div class="status" id="editStatus"></div>
    </form>`;
  document.getElementById('editModal').style.display = 'flex';

  const getShip = ()=>{ const r = box.querySelector('input[name="editShip"]:checked'); return r ? r.value : null; };
  const syncAddr = ()=>{ const m = getShip(); document.getElementById('editAddrGroup').style.display = (m && SHIP_METHODS[m].needsAddress) ? 'block' : 'none'; };
  const recalc = ()=>{
    let t = 0;
    box.querySelectorAll('.edit-qty').forEach(inp=>{ const it = o.items[+inp.dataset.idx]; t += it.price * Math.max(0, parseInt(inp.value)||0); });
    document.getElementById('editTotal').textContent = fmtPrice(t) + ' تومان';
    return t;
  };
  box.querySelectorAll('input[name="editShip"]').forEach(r=>r.addEventListener('change', ()=>{ document.getElementById('editShipErr').textContent=''; syncAddr(); }));
  box.querySelectorAll('.edit-qty').forEach(i=>i.addEventListener('input', recalc));
  document.getElementById('editCancelBtn').onclick = closeEditModal;
  syncAddr();

  document.getElementById('editForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const st = document.getElementById('editStatus'); st.className = 'status'; st.textContent = '';
    const method = getShip();
    const name = document.getElementById('editName'), mobile = document.getElementById('editMobile');
    const province = document.getElementById('editProvince'), city = document.getElementById('editCity');
    const postal = document.getElementById('editPostal'), address = document.getElementById('editAddress');
    let ok = true;
    if (!method){ document.getElementById('editShipErr').textContent = 'روش دریافت سفارش را انتخاب کنید'; ok = false; }
    if (!name.value.trim()){ setFErr(name,'نام را وارد کنید'); ok = false; } else setFErr(name,'');
    if (!mobileRe.test(mobile.value.trim())){ setFErr(mobile,'شماره موبایل معتبر نیست'); ok = false; } else setFErr(mobile,'');
    const needs = method && SHIP_METHODS[method].needsAddress;
    if (needs){
      if (!province.value.trim()){ setFErr(province,'استان را وارد کنید'); ok=false; } else setFErr(province,'');
      if (!city.value.trim()){ setFErr(city,'شهر را وارد کنید'); ok=false; } else setFErr(city,'');
      if (!/^\d{10}$/.test(postal.value.trim())){ setFErr(postal,'کد پستی ۱۰ رقمی معتبر نیست'); ok=false; } else setFErr(postal,'');
      if (!address.value.trim()){ setFErr(address,'آدرس را وارد کنید'); ok=false; } else setFErr(address,'');
    }
    const newItems = [];
    box.querySelectorAll('.edit-qty').forEach(inp=>{
      const it = o.items[+inp.dataset.idx]; const q = Math.max(0, parseInt(inp.value)||0);
      if (q > 0) newItems.push({ ...it, qty:q, lineTotal: it.price*q });
    });
    const itemsErr = document.getElementById('editItemsErr');
    if (!newItems.length){ itemsErr.textContent = 'حداقل یک کالا باید در سفارش بماند (برای حذف کل سفارش از دکمه‌ی لغو استفاده کنید).'; ok = false; } else itemsErr.textContent = '';
    if (!ok){ st.className = 'status bad'; st.textContent = 'فرم ناقص یا نادرست است.'; return; }

    const btn = document.getElementById('editSaveBtn'); btn.disabled = true; btn.textContent = 'در حال ذخیره...';
    try{
      await customerMutateOrder(oid, ord=>{
        ord.account = ord.account || { name: CUSTOMER.name, mobile: CUSTOMER.mobile };
        ord.receiver = { name: name.value.trim(), mobile: mobile.value.trim() };
        ord.shipping = { method, label: SHIP_METHODS[method].label };
        ord.address = needs ? { province: province.value.trim(), city: city.value.trim(), postalCode: postal.value.trim(), full: address.value.trim() } : null;
        ord.notes = document.getElementById('editNotes').value.trim();
        ord.items = newItems;
        ord.total = newItems.reduce((t,it)=>t+it.lineTotal, 0);
        ord.edited = true;
        ord.history = ord.history || [];
        ord.history.push({ status:'pending', note:'ویرایش سفارش', date:nowJalali(), time:nowTime(), by:'customer' });
      });
      closeEditModal();
      await loadMyOrders();
    } catch(err){
      st.className = 'status bad'; st.textContent = err.message;
      btn.disabled = false; btn.textContent = 'ذخیره تغییرات';
    }
  });
}

let profileSection = 'overview';

function renderProfile(section){
  if (!PROFILE_SECTIONS.some(x=>x.id===section)) section = 'overview';
  profileSection = section;
  const initial = (CUSTOMER.name || '؟').trim().charAt(0);
  document.getElementById('profileSide').innerHTML = `
    <div class="avatar">${esc(initial)}</div>
    <div class="side-name">${esc(CUSTOMER.name)}</div>
    <div class="side-mobile">${esc(CUSTOMER.mobile)}</div>
    <nav class="side-menu">
      ${PROFILE_SECTIONS.map(x=>`<a href="#/account/${x.id}" class="side-item ${x.id===section?'active':''}"><svg viewBox="0 0 24 24">${x.icon}</svg>${x.label}</a>`).join('')}
      <button type="button" class="side-item logout" id="sideLogout"><svg viewBox="0 0 24 24"><path d="M9 4H5v16h4"/><path d="M16 8l4 4-4 4M20 12H9"/></svg>خروج از حساب</button>
    </nav>`;
  document.getElementById('sideLogout').onclick = ()=>{
    CUSTOMER = null; localStorage.removeItem('fs_customer'); updateAccountLink(); location.hash = '#/';
  };
  PROFILE_SECTIONS.forEach(x=>document.getElementById('pane-'+x.id).classList.toggle('active', x.id===section));
  if (section === 'overview') renderOverview();
  if (section === 'info') renderInfoPane();
  if (section === 'orders') loadMyOrders();
  if (section === 'password') renderPasswordPane();
  if (section === 'support') renderSupportPane();
}

async function renderOverview(){
  const pane = document.getElementById('pane-overview');
  const head = `
    <div class="pane-card welcome">
      <div><h3>سلام، ${esc(CUSTOMER.name)} 👋</h3><p>${CUSTOMER.since ? 'عضو فروشگاه از ' + esc(CUSTOMER.since) : 'به حساب کاربری خود خوش آمدید'}</p></div>
      <div class="quick"><a href="#/" class="btn gold">ادامه خرید</a><a href="#/cart" class="btn outline" style="color:#fff;border-color:#fff;">سبد خرید (${fmtPrice(cartCount())})</a></div>
    </div>`;
  pane.innerHTML = head + '<div class="empty-state">در حال بارگذاری آمار...</div>';
  let list;
  try{ list = await fetchMyOrders(); }
  catch(err){ pane.innerHTML = head + `<div class="status bad" style="display:block;">${esc(err.message)}</div>`; return; }
  if (profileSection !== 'overview') return;
  const active = list.filter(o=>o.status !== 'canceled');
  const cnt = st => list.filter(o=>st.includes(o.status)).length;
  const spend = active.reduce((t,o)=>t + (o.total||0), 0);
  const last = list[0];
  pane.innerHTML = head + `
    <div class="stat-grid">
      <div class="stat-card"><div class="n">${fmtPrice(list.length)}</div><div class="l">کل سفارش‌ها</div></div>
      <div class="stat-card"><div class="n">${fmtPrice(cnt(['pending']))}</div><div class="l">در انتظار تأیید</div></div>
      <div class="stat-card"><div class="n">${fmtPrice(cnt(['preparing','shipped']))}</div><div class="l">در جریان</div></div>
      <div class="stat-card"><div class="n">${fmtPrice(cnt(['done']))}</div><div class="l">تحویل‌شده</div></div>
      <div class="stat-card"><div class="n sm">${fmtPrice(spend)}</div><div class="l">جمع خرید (تومان)</div></div>
    </div>
    <div class="pane-card">
      <h3>آخرین سفارش</h3>
      ${last ? `
        <p><b>سفارش ${esc(String(last.id).slice(-6))}</b> — ${esc(last.date||'')} ${esc(last.time||'')}</p>
        <p>${last.items.map(it=>esc(it.name)+' ×'+fmtPrice(it.qty)).join('، ')}</p>
        <p>روش دریافت: ${esc(last.shipping.label)} &nbsp;|&nbsp; مبلغ: <b>${fmtPrice(last.total)} تومان</b></p>
        <p><span class="pill ${last.status==='pending'?'pending':last.status}">${statusLabel(last.status, last.shipping.method)}</span></p>
        <a href="#/account/orders" class="btn" style="display:inline-block;margin-top:6px;">مشاهده جزئیات و مدیریت سفارش</a>`
      : `<p>هنوز سفارشی ثبت نکرده‌اید.</p><a href="#/" class="btn" style="display:inline-block;">مشاهده محصولات</a>`}
    </div>
    <div class="pane-card">
      <h3>میان‌بُرها</h3>
      <div class="quick">
        <a href="#/account/info" class="btn outline">ویرایش اطلاعات و آدرس پیش‌فرض</a>
        <a href="#/account/password" class="btn outline">تغییر رمز عبور</a>
        <a href="#/account/support" class="btn outline">پشتیبانی</a>
      </div>
    </div>`;
}

async function mutateCustomer(mutate){
  if (!CONFIG) CONFIG = await loadConfig();
  const { data, sha } = await ghGetFile(CUSTOMERS_FILE);
  const rec = data.find(u=>u.mobile === CUSTOMER.mobile);
  if (!rec) throw new Error('حساب شما در سیستم پیدا نشد');
  await mutate(rec);
  await ghPutFile(CUSTOMERS_FILE, data, sha, `بروزرسانی حساب ${rec.mobile}`);
  return rec;
}
